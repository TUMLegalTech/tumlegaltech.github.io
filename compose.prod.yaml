# Production compose for self-hosting on LT-HP.
#
# Two services:
#   builder — one-shot, builds the static site into _site/ and exits.
#   caddy   — long-running, serves _site/ on :80/:443 with auto Let's Encrypt.
#
# Deploy / refresh content:
#   git pull
#   docker compose -f compose.prod.yaml run --rm builder
#   docker compose -f compose.prod.yaml up -d caddy   # only first time / on Caddyfile change
#
# Caddy reads files live from the _site/ bind mount, so a fresh build is
# served without restarting Caddy.

services:
  builder:
    build: .
    image: tumlegaltech-jekyll:latest
    command: bash -c "rm -f Gemfile.lock && bundle exec jekyll build --lsi"
    environment:
      JEKYLL_ENV: production
    volumes:
      - .:/srv/jekyll
    restart: "no"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./_site:/srv/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
