# Production compose for LT-HP. Caddy is the only service: it serves the
# static _site/ directory that GitHub Actions rsyncs in on every push to main.
#
# This file lives both in the repo (versioned) and at /srv/tumlegaltech/ on
# the VM. Bring up / restart with:
#   docker compose -f compose.prod.yaml up -d caddy
#
# Routine content updates do not touch this file — CI rsyncs into _site/
# and Caddy serves the new content immediately (no restart needed).

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./_site:/srv/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # bin/cert-renew-hook (installed at /usr/local/cert.d/) copies the
      # rbg-cert-issued fullchain.pem + privkey.pem into /etc/caddy/tls/
      # whenever the cert renews, so this directory is the authoritative
      # source for the running Caddy process.
      - /etc/caddy/tls:/etc/caddy/tls:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
