<div class="supporters">
  {% for s in site.data.supporters %}
    <a class="supporter{% if s.compact %} supporter-compact{% endif %}" href="{{ s.url }}" target="_blank" rel="noopener" aria-label="{{ s.name }}">
      <img src="{{ s.logo | relative_url }}" alt="{{ s.name }}">
    </a>
  {% endfor %}
</div>
