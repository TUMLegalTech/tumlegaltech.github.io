<dialog id="bibtex-citation-dialog" class="bibtex-dialog" aria-labelledby="bibtex-citation-title">
  <div class="bibtex-dialog-header">
    <h2 id="bibtex-citation-title">BibTeX formatted citation</h2>
    <button type="button" class="bibtex-dialog-close" aria-label="Close citation">&times;</button>
  </div>
  <textarea class="bibtex-dialog-text" aria-label="BibTeX citation" readonly spellcheck="false" autofocus></textarea>
  <div class="bibtex-dialog-actions">
    <button type="button" class="bibtex-dialog-copy">Copy citation</button>
    <a class="bibtex-dialog-download" href="#" download>Download .bib</a>
    <span class="bibtex-dialog-status" role="status"></span>
  </div>
</dialog>
<script defer src="{{ '/assets/js/bibtex_citation.js' | relative_url | bust_file_cache }}"></script>
