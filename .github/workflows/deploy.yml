name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true

      - name: Update _config.yml ⚙️
        run: yq -i '.giscus.repo = "${{ github.repository }}"' _config.yml

      - name: Install and Build 🔧
        run: |
          npm install -g mermaid.cli
          npm install -g purgecss
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi
          purgecss -c purgecss.config.js

      - name: Test (html-proofer) 🧪
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --allow-hash-href \
            --ignore-urls "/^mailto:/,/^http:\/\/127\.0\.0\.1/,/^http:\/\/0\.0\.0\.0/,/^http:\/\/localhost/,/what-a-benger\.net/"

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/

      # Primary deploy target: the `production` branch. LT-HP polls this
      # every ~2 min via systemd and rsyncs into /srv/tumlegaltech/_site/.
      # See DEPLOY.md.
      - name: Publish to production branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production
          folder: _site

      # Fallback: keep GitHub Pages publishing tum-legal-tech.github.io
      # while the VM-side deploy is being soaked. Drop this step once
      # the VM has been stable for a release cycle.
      - name: Publish to gh-pages branch (fallback) 🛟
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
