name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true

      # this was in your original workflow — keeps it
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@v0.13.1
        with:
          commitChange: false
          valueFile: '_config.yml'
          propertyPath: 'giscus.repo'
          value: ${{ github.repository }}

      - name: Install and Build 🔧
        run: |
          npm install -g mermaid.cli
          npm install -g purgecss
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi
          purgecss -c purgecss.config.js

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages   # 👈 make it explicit
          folder: _site

      # Ship the same _site/ artifact to LT-HP, where Caddy serves it.
      # See DEPLOY.md for the SSH key and known-hosts secret setup.
      - name: Deploy to LT-HP 🚛
        if: github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.LT_HP_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LT_HP_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::LT_HP_DEPLOY_KEY or LT_HP_KNOWN_HOSTS secret not set; skipping VM deploy"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY"   > ~/.ssh/deploy_key   && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS"  > ~/.ssh/known_hosts  && chmod 600 ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            _site/ \
            tumlegaltech@ltvm5.cit.tum.de:/srv/tumlegaltech/_site/

